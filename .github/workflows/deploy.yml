name: 🚀 Build & Deploy to Production (Site5)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 📦 Build React SPA & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: 📦 Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: 🏗️ Build React SPA (Vite)
        working-directory: apps/web
        run: npm run build

      - name: 🐍 Deploy Built Assets to Production FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 deploy/scripts/ci_deploy.py

      - name: 🩺 Smoke Test & Health Check
        run: |
          curl -I -s -f "https://warhorsenm.dataholics.com.mx/" || echo "Web root check"
          curl -I -s "https://warhorsenm.dataholics.com.mx/api/v1/auth/me" | grep -E "HTTP/.* (401|200)" || true
